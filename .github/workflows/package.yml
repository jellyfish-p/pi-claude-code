name: Package

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}" >&2
            exit 1
          }

      - name: Run tests
        run: npm test

      - name: Build npm tarball
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist --json | tee dist/pack.json

      - name: Inspect tarball
        run: |
          set -euo pipefail
          TARBALL="$(find dist -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          tar -tzf "$TARBALL" | sed -n '1,80p'

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: pi-claude-native-tools
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  release-asset:
    name: Attach tarball to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@v8
        with:
          name: pi-claude-native-tools
          path: dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
